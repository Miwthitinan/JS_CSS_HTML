<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ตัวอย่าง Do While Loop</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <p id="dev"></p>

    <script>
      let text = "";
      let i = 10;

      do {
        text += "Do-While: นับครั้งที่ "+ i + "<br>";
        i++;
      }
      while (i < 5) // เงื่อนไขเป็น false
      document.getElementById("dev").innerHTML = text;
    </script>
  </body>
</html>

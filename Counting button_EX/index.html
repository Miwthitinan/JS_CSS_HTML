<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        #count {
            font-size: 60px;
            margin: 20px 0;
            font-weight: bold;
        }

        button {
            font-size: 24px;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .plus {
            background: #000000;
            color: white;
        }

        .minus {
            background: #000000;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">
    <div id="count">0</div>

    <button class="minus">-</button>
    <button class="plus">+</button>
    </div>

    <script>
        let count = 0;
        const countEl = document.getElementById("count");
        const plusBtn = document.querySelector(".plus");
        const minusBtn = document.querySelector(".minus");
        plusBtn.addEventListener("click", () => {
            count++;
            countEl.textContent = count;
        });
        minusBtn.addEventListener("click", () => {
            count--;
            if (count < 0) count = 0;
            countEl.textContent = count;
        });
    </script>
</body>
</html>

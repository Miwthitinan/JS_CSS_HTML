<!DOCTYPE html>
<html lang="th">
<head>
  <title>ตัวอย่าง Function</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <h2>คำนวณพื้นที่สี่เหลี่ยม</h2>
  <label for="widthInput">ความกว้าง:</label>
  <input type="number" id="widthInput" value="10"> 
  <br><br>
  
  <label for="lengthInput">ความยาว:</label>
  <input type="number" id="lengthInput" value="5">
  <br><br>

  <button onclick="calculateArea()">คำนวณ</button>
  <hr> 
  <p>ผลลัพธ์: <span id="resultDisplay">รอการคำนวณ...</span></p>
  <script>
  /**
   * * ฟังก์ชันสำหรับคำนวณพื้นที่สี่เหลี่ยมและแสดงผล
   * */
    function calculateArea() {
       // A. รับค่าจาก Input ใน HTML
       const width = parseFloat(document.getElementById("widthInput").value);
       const length = parseFloat(document.getElementById("lengthInput").value);
       // B. ประมวลผล (Function Body)
       const area = width * length;
       // C. แสดงผลลัพธ์กลับไปยัง Element ใน HTML
       document.getElementById("resultDisplay").innerHTML = area;
      }
  </script>
</body>
</html>

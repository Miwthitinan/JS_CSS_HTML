<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ตัวอย่าง While Loop </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <p id="dev"></p>
    <script>
      let text = "";

      let i = 0;
      while (i < 15) {
        text += "Number "+ i + "<br>";
        i++;
      }

      document.getElementById("dev").innerHTML = text;
    </script>
  </body>
</html>

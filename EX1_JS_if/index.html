<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ตัวอย่าง if</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <p id="dev"></p>
    <script>
    let age = 19;
    let text = "คุณไม่สามารถลงทะเบียนได้";
    
    if (age >= 18){
      text = "คุณสามารถลงทะเบียนได้";
    }

    document.getElementById("dev").innerHTML = text;
    </script>
  </body>
</html>

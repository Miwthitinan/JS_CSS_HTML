<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ตัวอย่าง else if</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <p id="score"></p>
    <script>
      let score = 85
      let text;

      if (score >= 85){
        text = "Grade A"
      }else if (score >= 75) {
        text = "Grade B"
      }else if (score >= 65) {
        text = "Grade C"
      }else if (score >= 55) {
        text = "Grade D"
      }else {
        text = "Grade F"
      }
      document.getElementById("score").innerHTML = text;
    </script>
  </body>
</html>

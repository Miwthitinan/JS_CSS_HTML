<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ตัวอย่าง for Loop</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <p id="dev"></p>
    
    <script>
      let text = "";
      for (let i=0;i<5;i++) {
        text += i + "<br>";
      }
      document.getElementById("dev").innerHTML = text;
    </script>
    
  </body>
</html>
